name: Check Senkuro Cards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Senkuro Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_senkuro.py

      - name: Save updated state (only last check is kept)
        run: |
          git config user.name "Senkuro Bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_state.json
          git diff --staged --quiet || git commit -m "Update last_state.json"
          git push
