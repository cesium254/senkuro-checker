name: Senkuro Full Automation Combine v16.0

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'logs/**'
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: "Задача (daemon | check | menu | promo | balance | packs | forge | farm | farm_status | all)"
        required: false
        default: "daemon"
      promo_code:
        description: "Промокод (для режима promo)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: senkuro-direct-telegram-bot
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  run-senkuro-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    outputs:
      continue_bot: ${{ steps.run_bot.outputs.continue_bot }}

    steps:
      - name: Instant Telegram Direct Connect & Early Responder (Runs in 3 Seconds)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8868493953:AAHyGgQCt4n2FrvyL6mPmFK8w1fq_LNpug4' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          cat << 'EOF' > /tmp/early_poller.py
          import json
          import os
          import re
          import time
          import urllib.request

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "8868493953:AAHyGgQCt4n2FrvyL6mPmFK8w1fq_LNpug4").strip()
          CHAT_ID = str(os.environ.get("TELEGRAM_CHAT_ID", "457787014")).strip()
          EVENT_NAME = os.environ.get("GH_EVENT_NAME", "push").strip()
          OFFSET_FILE = "/tmp/tg_offset.txt"
          QUEUE_FILE = "/tmp/senkuro_early_queue.jsonl"

          # Единая постоянная нижняя клавиатура (is_persistent=True не даёт ей пропадать, а значок [v] / 🎛 сворачивает её в любой момент!)
          REPLY_KEYBOARD = {
              "keyboard": [
                  [{"text": "▶️ Фарм (8 ч)"}, {"text": "📊 Статус фарма"}],
                  [{"text": "🪙 Баланс монет"}, {"text": "🎴 Паки Хардкор"}],
                  [{"text": "⚒️ Кузня + Трейд"}, {"text": "🎟 Промокод"}],
                  [{"text": "🔄 Чекать 5 акков"}, {"text": "🚀 Сделать ВСЁ"}],
                  [{"text": "📸 Экран"}, {"text": "📜 Лог"}, {"text": "🛑 СТОП"}],
              ],
              "resize_keyboard": True,
              "is_persistent": True,
              "input_field_placeholder": "Промокод или меню 🎛 👇",
          }

          def tg_call(method, payload, timeout=10):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode("utf-8"))
              except Exception:
                  return {}

          def send_msg(text):
              body = {
                  "chat_id": CHAT_ID,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
                  "reply_markup": REPLY_KEYBOARD,
              }
              tg_call("sendMessage", body)

          def append_queue(action, promo=""):
              with open(QUEUE_FILE, "a", encoding="utf-8") as f:
                  f.write(json.dumps({"action": action, "promo_code": promo}) + "\n")

          # 1. Мгновенно отключаем старый вебхук Cloudflare и стираем чужую спам-рекламу из описания бота!
          tg_call("deleteWebhook", {"drop_pending_updates": False})
          clean_desc = "Личный бот автоматизации Senkuro (проверка 5 аккаунтов, паки Хардкор, Переплавка, промокоды и фарм)."
          for lang in ("", "ru", "uk", "en", "be", "kk"):
              dp = {"description": clean_desc}
              sp = {"short_description": "Автоматизация Senkuro"}
              if lang:
                  dp["language_code"] = lang
                  sp["language_code"] = lang
              tg_call("setMyDescription", dp)
              tg_call("setMyShortDescription", sp)

          # 2. Фиксируем текущий offset
          offset = 0
          res = tg_call("getUpdates", {"offset": -1, "timeout": 1})
          if res.get("ok") and res.get("result"):
              offset = int(res["result"][-1]["update_id"]) + 1
          with open(OFFSET_FILE, "w", encoding="utf-8") as f:
              f.write(str(offset))

          # 3. При сохранении кода (push) сразу через 3 секунды присылаем компактную нижнюю панель v16.0!
          if EVENT_NAME == "push":
              send_msg(
                  "✅ <b>Единый комбайн Senkuro v16.0 запущен!</b>\n\n"
                  "• Нижнее меню 🎛 закреплено (больше никогда не пропадает и не сбивается старыми верхними кнопками).\n"
                  "• Вход в аккаунты вынесен в чистый Google Chrome + X11 (xdotool) с обходом закрытого Shadow DOM Cloudflare Turnstile.\n\n"
                  "Нажимайте любую кнопку внизу 👇:"
              )

          # 4. Слушаем нажатия кнопок, пока подготавливается окружение (~25 сек)
          while True:
              res = tg_call("getUpdates", {"offset": offset, "timeout": 2}, timeout=6)
              for upd in res.get("result") or []:
                  uid = int(upd.get("update_id") or 0)
                  if uid >= offset:
                      offset = uid + 1
                      with open(OFFSET_FILE, "w", encoding="utf-8") as f:
                          f.write(str(offset))
                  cb = upd.get("callback_query")
                  if cb:
                      cb_id = cb.get("id")
                      data = str(cb.get("data") or "").strip()
                      if data == "stop_all_farm":
                          if os.path.exists(QUEUE_FILE):
                              os.remove(QUEUE_FILE)
                          tg_call("answerCallbackQuery", {"callback_query_id": cb_id, "text": "🛑 Все задачи остановлены!"})
                          send_msg("🛑 <b>Очередь и все активные задачи остановлены!</b>")
                      elif data == "check_farm_status":
                          tg_call("answerCallbackQuery", {"callback_query_id": cb_id, "text": "Проверяю статус фарма..."})
                          send_msg("⚪ <b>Сейчас 8-часовой фарм манги не запущен.</b>\nНажмите <b>«▶️ Фарм (8 ч)»</b> в нижнем меню 🎛!")
                      elif data == "prompt_promo":
                          tg_call("answerCallbackQuery", {"callback_query_id": cb_id, "text": "Введите промокод в чат 👇"})
                          send_msg("🎟 <b>Просто напишите и отправьте промокод одним словом в этот чат:</b>")
                      else:
                          amap = {
                              "start_farm_8h": ("farm", "▶️ Запускаю 8-часовой фарм манги на 4 аккаунтах!"),
                              "check_balance": ("balance", "🪙 Проверка баланса монет (4 акка) принята!"),
                              "roll_packs": ("packs", "🎴 Прокрутка паков «Хардкор» (480 🪙) принята!"),
                              "run_forge": ("forge", "⚒️ Переплавка + Трейд на основу приняты!"),
                              "check_senkuro": ("check", "🔄 Проверка карт и осколков (5 аккаунтов) принята!"),
                              "run_all": ("all", "🚀 Полный цикл (Паки + Переплавка + Трейд) принят!"),
                          }
                          act_c, lbl = amap.get(data, ("check", "🔄 Проверка 5 аккаунтов принята!"))
                          tg_call("answerCallbackQuery", {"callback_query_id": cb_id, "text": lbl})
                          append_queue(act_c, "")
                          send_msg(f"⏳ <b>{lbl}</b>\nПодготавливаю браузер (~20 сек) и сразу пришлю отчёт!")
                  msg = upd.get("message")
                  if msg and msg.get("text"):
                      txt = str(msg.get("text") or "").strip()
                      low = txt.lower()
                      btn_map = {
                          "▶️ фарм (8 ч)": ("farm", "▶️ Запускаю 8-часовой фарм манги на 4 аккаунтах!"),
                          "▶️ запустить фарм (8 ч)": ("farm", "▶️ Запускаю 8-часовой фарм манги на 4 аккаунтах!"),
                          "/farm": ("farm", "▶️ Запускаю 8-часовой фарм манги на 4 аккаунтах!"),
                          "🪙 баланс монет": ("balance", "🪙 Проверка баланса монет (4 акка) принята!"),
                          "🪙 баланс монет (4 акка)": ("balance", "🪙 Проверка баланса монет (4 акка) принята!"),
                          "/balance": ("balance", "🪙 Проверка баланса монет (4 акка) принята!"),
                          "🎴 паки хардкор": ("packs", "🎴 Прокрутка паков «Хардкор» (480 🪙) принята!"),
                          "🎴 крутить паки хардкор": ("packs", "🎴 Прокрутка паков «Хардкор» (480 🪙) принята!"),
                          "/packs": ("packs", "🎴 Прокрутка паков «Хардкор» (480 🪙) принята!"),
                          "⚒️ кузня + трейд": ("forge", "⚒️ Переплавка + Трейд на основу приняты!"),
                          "⚒️ переплавка + трейд": ("forge", "⚒️ Переплавка + Трейд на основу приняты!"),
                          "/forge": ("forge", "⚒️ Переплавка + Трейд на основу приняты!"),
                          "🔄 чекать 5 акков": ("check", "🔄 Проверка карт и осколков (5 аккаунтов) принята!"),
                          "🔄 проверить 5 аккаунтов": ("check", "🔄 Проверка карт и осколков (5 аккаунтов) принята!"),
                          "/check": ("check", "🔄 Проверка карт и осколков (5 аккаунтов) принята!"),
                          "🚀 сделать всё": ("all", "🚀 Полный цикл (Паки + Переплавка + Трейд) принят!"),
                          "🚀 сделать всё (паки+кузня)": ("all", "🚀 Полный цикл (Паки + Переплавка + Трейд) принят!"),
                      }
                      if low in ("/start", "/menu", "/help", "меню"):
                          send_msg("🤖 <b>Панель управления фермой Senkuro v16.0</b>\n\nВыберите задачу кнопкой в нижнем меню 🎛:")
                      elif low in ("/stop", "🛑 стоп", "стоп", "🛑 остановить фарм / все задачи"):
                          if os.path.exists(QUEUE_FILE):
                              os.remove(QUEUE_FILE)
                          send_msg("🛑 <b>Все задачи остановлены!</b>")
                      elif low in ("/status", "📊 статус фарма", "📊 проверить статус фарма"):
                          send_msg("⚪ <b>Сейчас 8-часовой фарм манги не запущен.</b>\nНажмите <b>«▶️ Фарм (8 ч)»</b> в нижнем меню 🎛!")
                      elif low in ("🎟 промокод", "🎟 ввести промокод"):
                          send_msg("🎟 <b>Просто напишите и отправьте промокод одним словом в этот чат:</b>")
                      elif low in ("📸 экран", "📸 посмотреть экран", "/screen", "📜 лог", "📜 полный лог", "/log"):
                          send_msg("⏳ Догружаю основной движок браузера (~15 сек) — сразу после старта кнопка сработает мгновенно!")
                      elif low in btn_map:
                          act_c, lbl = btn_map[low]
                          append_queue(act_c, "")
                          send_msg(f"⏳ <b>{lbl}</b>\nПодготавливаю браузер (~20 сек) и сразу пришлю отчёт!")
                      else:
                          pcode = txt[7:].strip().upper() if low.startswith("/promo ") else (txt.upper() if not txt.startswith("/") and re.match(r"^[A-Za-z0-9_-]{4,32}$", txt) else "")
                          if pcode:
                              append_queue("promo", pcode)
                              send_msg(f"🎟 Принят промокод <code>{pcode}</code>!\n⏳ Подготавливаю браузер (~20 сек) и проверяю начисление монет на 4 аккаунтах...")
              time.sleep(0.5)
          EOF
          nohup python3 /tmp/early_poller.py >/tmp/early_poller.log 2>&1 &
          echo $! > /tmp/early_poller.pid
          sleep 3

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Login Sessions (.sessions) & Opera Proxy
        uses: actions/cache@v4
        with:
          path: |
            .sessions
            bin
          key: senkuro-sessions-v16-${{ github.run_id }}
          restore-keys: |
            senkuro-sessions-v16-
            senkuro-sessions-v15-

      - name: Install Playwright, Chromium, Xvfb, xdotool & Openbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool openbox
          pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download Opera VPN Proxy (for 4 unique IPs)
        run: |
          mkdir -p bin .sessions
          if [ ! -f bin/opera-proxy ]; then
            curl -L -sS https://github.com/Alexey71/opera-proxy/releases/latest/download/opera-proxy.linux-amd64 -o bin/opera-proxy
            chmod +x bin/opera-proxy
          fi

      - name: Run Senkuro Automation Combine v16.0 (Direct Telegram Engine)
        id: run_bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8868493953:AAHyGgQCt4n2FrvyL6mPmFK8w1fq_LNpug4' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
          SENKURO_ACTION: ${{ github.event.inputs.action || 'daemon' }}
          SENKURO_PROMO_CODE: ${{ github.event.inputs.promo_code || '' }}
        run: |
          if [ -f /tmp/early_poller.pid ]; then
            kill $(cat /tmp/early_poller.pid) 2>/dev/null || true
            sleep 1
          fi
          xvfb-run -a --server-args="-screen 0 1280x900x24" bash -c "openbox >/dev/null 2>&1 & sleep 1 && python check_senkuro.py --action '${SENKURO_ACTION}' --promo-code '${SENKURO_PROMO_CODE}'"

      - name: Save Sessions & State Artifact for Part 2 Continuation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senkuro-farm-sessions-${{ github.run_id }}
          path: .sessions/
          retention-days: 1

  continue-bot-second-half:
    needs: run-senkuro-bot
    if: needs.run-senkuro-bot.outputs.continue_bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Instant Early Poller for Part 2 Handoff
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8868493953:AAHyGgQCt4n2FrvyL6mPmFK8w1fq_LNpug4' }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" -H "Content-Type: application/json" -d '{"drop_pending_updates":false}' || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Login Sessions from Part 1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: senkuro-farm-sessions-${{ github.run_id }}
          path: .sessions/

      - name: Cache Updated Login Sessions (.sessions) & Opera Proxy
        uses: actions/cache@v4
        with:
          path: |
            .sessions
            bin
          key: senkuro-sessions-v16-part2-${{ github.run_id }}
          restore-keys: |
            senkuro-sessions-v16-

      - name: Install Playwright, Chromium, Xvfb, xdotool & Openbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xdotool openbox
          pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Download Opera VPN Proxy (for 4 unique IPs)
        run: |
          mkdir -p bin .sessions
          if [ ! -f bin/opera-proxy ]; then
            curl -L -sS https://github.com/Alexey71/opera-proxy/releases/latest/download/opera-proxy.linux-amd64 -o bin/opera-proxy
            chmod +x bin/opera-proxy
          fi

      - name: Run Senkuro Automation Combine v16.0 (Part 2 — Hours 4 to 8)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8868493953:AAHyGgQCt4n2FrvyL6mPmFK8w1fq_LNpug4' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" bash -c "openbox >/dev/null 2>&1 & sleep 1 && python check_senkuro.py --action 'daemon'"
