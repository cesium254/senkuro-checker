name: Senkuro Auto-Trade Assistant v60.0

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: "Задача (daemon | my_cards | find_trades | auto_wave_manual)"
        required: false
        default: "daemon"

permissions:
  contents: read

concurrency:
  group: senkuro-public-trade-assistant
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  part1-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Instant Early Poller (Answers Buttons in 3 Seconds During Boot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          cat << 'EOF' > /tmp/early_poller.py
          import json, os, socket, time, urllib.request

          _orig_gai = socket.getaddrinfo
          def _ipv4_gai(host, port, family=0, type=0, proto=0, flags=0):
              if host and "telegram.org" in str(host):
                  return _orig_gai(host, port, socket.AF_INET, type, proto, flags)
              return _orig_gai(host, port, family, type, proto, flags)
          socket.getaddrinfo = _ipv4_gai

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = str(os.environ.get("TELEGRAM_CHAT_ID", "457787014")).strip()
          EVENT_NAME = os.environ.get("GH_EVENT_NAME", "").strip()
          OFFSET_FILE = "/tmp/tg_offset.txt"
          QUEUE_FILE = "/tmp/senkuro_early_queue.jsonl"
          KB = {
              "keyboard": [[{"text": "🃏 Мои карты"}, {"text": "🎯 Найти обмены"}], [{"text": "⚡ Авто-волна"}, {"text": "📜 Лог"}]],
              "resize_keyboard": True,
              "is_persistent": False,
              "input_field_placeholder": "Выберите действие 🎛 👇",
          }

          def tg(method, payload, timeout=8):
              url = f"https://api.telegram.org/bot{TOKEN}/{method}"
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read().decode("utf-8"))
              except Exception:
                  return {}

          def send(txt):
              tg("sendMessage", {"chat_id": CHAT_ID, "text": txt, "parse_mode": "HTML", "reply_markup": KB})

          def enqueue(act):
              with open(QUEUE_FILE, "a", encoding="utf-8") as f:
                  f.write(json.dumps({"action": act}) + "\n")

          offset = 0
          res = tg("getUpdates", {"offset": -1, "timeout": 1})
          if res.get("ok") and res.get("result"):
              offset = int(res["result"][-1]["update_id"]) + 1
          with open(OFFSET_FILE, "w", encoding="utf-8") as f:
              f.write(str(offset))

          if EVENT_NAME == "push":
              send("⏳ <b>Обновление v60.0 получено! Перезапускаю сервер (~15 сек)...</b>")

          start_ts = time.time()
          while not os.path.exists("/tmp/senkuro_main_ready.flag") and (time.time() - start_ts < 65):
              r = tg("getUpdates", {"offset": offset, "timeout": 2}, timeout=6)
              for u in r.get("result") or []:
                  uid = int(u.get("update_id") or 0)
                  if uid >= offset:
                      offset = uid + 1
                      with open(OFFSET_FILE, "w", encoding="utf-8") as f:
                          f.write(str(offset))
                  msg = u.get("message")
                  if msg and msg.get("text"):
                      low = str(msg.get("text") or "").strip().lower()
                      m = {"🃏 мои карты": "my_cards", "/cards": "my_cards", "🎯 найти обмены": "find_trades", "/find": "find_trades", "⚡ авто-волна": "auto_wave_manual", "📜 лог": "log", "/log": "log"}
                      if low in m:
                          enqueue(m[low])
                          send("⏳ Команда принята — сервер завершает старт (~15 сек) и сразу ответит!")
              time.sleep(0.4)
          EOF
          rm -f /tmp/senkuro_main_ready.flag
          nohup python3 /tmp/early_poller.py >/tmp/early_poller.log 2>&1 &
          echo $! > /tmp/early_poller.pid
          sleep 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Trade Database & SenkuTools Cache (.sessions)
        uses: actions/cache@v4
        with:
          path: |
            .sessions
            bin
          key: senkuro-trader-db-v50-p1-${{ github.run_id }}
          restore-keys: |
            senkuro-trader-db-v50-
            senkuro-trader-db-v49-

      - name: Install Playwright & Pillow
        run: |
          pip install -q --timeout 20 --retries 2 playwright pillow
          if [ ! -x /usr/bin/google-chrome-stable ]; then
            playwright install chromium
          fi

      - name: Download Opera Proxy
        run: |
          mkdir -p bin .sessions
          if [ ! -f bin/opera-proxy ]; then
            curl -L -sS --connect-timeout 10 --max-time 35 --retry 2 https://github.com/Alexey71/opera-proxy/releases/latest/download/opera-proxy.linux-amd64 -o bin/opera-proxy || true
            chmod +x bin/opera-proxy 2>/dev/null || true
          fi

      - name: Run Senkuro Auto-Trade v60.0 (Part 1 — Hours 0 to 4.1)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
          SENKURO_MAIN_TOKEN: ${{ secrets.SENKURO_MAIN_TOKEN }}
          UKRAINE_PROXY_URL: ${{ secrets.UKRAINE_PROXY_URL }}
          SENKURO_ACTION: ${{ github.event.inputs.action || 'daemon' }}
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          touch /tmp/senkuro_main_ready.flag
          pkill -9 -f early_poller.py 2>/dev/null || true
          python check_senkuro.py --action "${SENKURO_ACTION}"

      - name: Save DB Artifact for Part 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senkuro-trader-db-p1-${{ github.run_id }}
          path: .sessions/
          include-hidden-files: true
          retention-days: 1

  part2-bot:
    needs: part1-bot
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache (.sessions & bin)
        uses: actions/cache@v4
        with:
          path: |
            .sessions
            bin
          key: senkuro-trader-db-v50-p2-${{ github.run_id }}
          restore-keys: |
            senkuro-trader-db-v50-

      - name: Restore DB from Part 1
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: senkuro-trader-db-p1-${{ github.run_id }}
          path: .sessions/

      - name: Install Playwright & Pillow
        run: |
          pip install -q --timeout 20 --retries 2 playwright pillow
          if [ ! -x /usr/bin/google-chrome-stable ]; then
            playwright install chromium
          fi

      - name: Download Opera Proxy
        run: |
          mkdir -p bin .sessions
          if [ ! -f bin/opera-proxy ]; then
            curl -L -sS --connect-timeout 10 --max-time 35 --retry 2 https://github.com/Alexey71/opera-proxy/releases/latest/download/opera-proxy.linux-amd64 -o bin/opera-proxy || true
            chmod +x bin/opera-proxy 2>/dev/null || true
          fi

      - name: Run Senkuro Auto-Trade v60.0 (Part 2 — Hours 4.1 to 8.2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
          SENKURO_MAIN_TOKEN: ${{ secrets.SENKURO_MAIN_TOKEN }}
          UKRAINE_PROXY_URL: ${{ secrets.UKRAINE_PROXY_URL }}
          IS_CONTINUATION_JOB: "true"
          GH_EVENT_NAME: "schedule"
        run: |
          python check_senkuro.py --action "daemon"

      - name: Save DB Artifact for Part 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: senkuro-trader-db-p2-${{ github.run_id }}
          path: .sessions/
          include-hidden-files: true
          retention-days: 1

  part3-bot:
    needs: part2-bot
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache (.sessions & bin)
        uses: actions/cache@v4
        with:
          path: |
            .sessions
            bin
          key: senkuro-trader-db-v50-p3-${{ github.run_id }}
          restore-keys: |
            senkuro-trader-db-v50-

      - name: Restore DB from Part 2
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: senkuro-trader-db-p2-${{ github.run_id }}
          path: .sessions/

      - name: Install Playwright & Pillow
        run: |
          pip install -q --timeout 20 --retries 2 playwright pillow
          if [ ! -x /usr/bin/google-chrome-stable ]; then
            playwright install chromium
          fi

      - name: Download Opera Proxy
        run: |
          mkdir -p bin .sessions
          if [ ! -f bin/opera-proxy ]; then
            curl -L -sS --connect-timeout 10 --max-time 35 --retry 2 https://github.com/Alexey71/opera-proxy/releases/latest/download/opera-proxy.linux-amd64 -o bin/opera-proxy || true
            chmod +x bin/opera-proxy 2>/dev/null || true
          fi

      - name: Run Senkuro Auto-Trade v60.0 (Part 3 — Hours 8.2 to 12.3)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '457787014' }}
          SENKURO_MAIN_TOKEN: ${{ secrets.SENKURO_MAIN_TOKEN }}
          UKRAINE_PROXY_URL: ${{ secrets.UKRAINE_PROXY_URL }}
          IS_CONTINUATION_JOB: "true"
          GH_EVENT_NAME: "schedule"
        run: |
          python check_senkuro.py --action "daemon"
